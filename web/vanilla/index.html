<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Growth Vanilla Web Example</title>
  <style>body{font-family:system-ui,sans-serif;max-width:720px;margin:64px auto;padding:0 20px;background:#080b10;color:#f4f7fb}button{padding:12px 16px;margin:5px;border:1px solid #263245;border-radius:999px;background:#111927;color:#fff;cursor:pointer}code{color:#9ec5ff}.muted{color:#8290a4}</style>
  <!-- Replace with the origin-scoped publishable key from Growth → Connections → Web. -->
  <script async src="https://growth.intellign.us/g.js" data-key="ig_pk_live_REPLACE_ME"></script>
</head>
<body>
  <p class="muted">Intellign Growth · Vanilla Web</p>
  <h1>A tiny store with meaningful signals.</h1>
  <p>Use the buttons in order, then return to Growth and verify the Web connection.</p>
  <button data-event="product_view">View Studio Lamp</button>
  <button data-event="add_to_cart">Add to cart</button>
  <button data-event="signup">Create account</button>
  <button data-event="purchase">Purchase · $79</button>
  <p id="status" class="muted">Waiting for an action.</p>
  <script>
    const status = document.querySelector('#status');
    document.querySelectorAll('[data-event]').forEach((button) => {
      button.addEventListener('click', () => {
        const event = button.dataset.event;
        // g.js observes supported business activity automatically. For a custom
        // event contract, use the JavaScript SDK example instead of inventing
        // a global API here.
        status.textContent = `Performed: ${event}. Check Growth for observed activity.`;
      });
    });
  </script>
</body>
</html>
